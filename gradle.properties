android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
#!/data/data/com.termux/files/usr/bin/bash
set -e

GRADLE_PROPS="gradle.properties"

if [ ! -f "$GRADLE_PROPS" ]; then
  echo "ERROR: run this from project root (where app/ folder is)"
  exit 1
fi

if grep -q "android.enableR8.fullMode" "$GRADLE_PROPS"; then
  echo "Already present, updating value..."
  sed -i 's/android.enableR8.fullMode=.*/android.enableR8.fullMode=false/' "$GRADLE_PROPS"
else
  echo "" >> "$GRADLE_PROPS"
  echo "# Fixes: java.lang.Class cannot be cast to java.lang.reflect.ParameterizedType" >> "$GRADLE_PROPS"
  echo "# (R8 full mode breaks Retrofit + Gson generic type reflection)" >> "$GRADLE_PROPS"
  echo "android.enableR8.fullMode=false" >> "$GRADLE_PROPS"
fi

echo "Done. Now run a CLEAN rebuild (this setting only takes effect on a fresh build):"
echo "  ./gradlew clean assembleRelease"
